# TW-CONTENT-005 — static research library (Astro SSG)
# Install: /etc/nginx/sites-available/research.timewoven.ru
# Enable: ln -sfn .../sites-available/research.timewoven.ru /etc/nginx/sites-enabled/
# TLS: certbot --nginx -d research.timewoven.ru (after HTTP vhost is active)

server {
    listen 80;
    listen [::]:80;
    server_name research.timewoven.ru;

    root /var/www/research.timewoven.ru;
    index index.html;

    access_log /var/log/nginx/research-timewoven-access.log;
    error_log /var/log/nginx/research-timewoven-error.log;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
