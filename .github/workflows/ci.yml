# Aligned with Dmitriy-Bondarev/TimeWoven — job name `quality` for branch rulesets.
name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Citation punctuation regression
        run: npm run verify:citations

      - name: Production build
        run: npm run build
